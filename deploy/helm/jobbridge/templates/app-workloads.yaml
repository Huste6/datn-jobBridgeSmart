{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobbridge.fullname" $ }}-{{ $name }}
  labels:
    {{- include "jobbridge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ default $.Values.global.imageTag $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.targetPort }}
              name: http
          env:
            {{- if $svc.needsMongo }}
            - name: MONGODB_URI
              value: "mongodb://{{ include "jobbridge.fullname" $ }}-mongodb:{{ $.Values.mongodb.service.port }}/jobbridge"
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ tpl ($v | toString) $ | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "jobbridge.fullname" $ }}-secret
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "jobbridge.fullname" $ }}-secret
                  key: OPENAI_API_KEY
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "jobbridge.fullname" $ }}-secret
                  key: CLOUDINARY_URL
            - name: CLOUDINARY_FOLDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "jobbridge.fullname" $ }}-secret
                  key: CLOUDINARY_FOLDER
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.liveness.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jobbridge.fullname" $ }}-{{ $name }}
  labels:
    {{- include "jobbridge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.targetPort }}
  selector:
    app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}