{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobbridge.fullname" $ }}-{{ $name }}
  labels:
    {{- include "jobbridge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  revisionHistoryLimit: {{ default (default 2 $.Values.global.revisionHistoryLimit) $svc.revisionHistoryLimit }}
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ default $.Values.global.imageTag $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.targetPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ include "jobbridge.fullname" $ }}-secret
          env:
            {{- if $svc.needsMongo }}
            - name: MONGODB_URI
              value: "mongodb://{{ include "jobbridge.fullname" $ }}-mongodb:{{ $.Values.mongodb.service.port }}/jobbridge"
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ tpl ($v | toString) $ | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.liveness.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
          {{- if $.Values.keyvault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if $.Values.keyvault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "jobbridge.fullname" $ }}-kv
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jobbridge.fullname" $ }}-{{ $name }}
  labels:
    {{- include "jobbridge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.targetPort }}
  selector:
    app.kubernetes.io/name: {{ include "jobbridge.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}