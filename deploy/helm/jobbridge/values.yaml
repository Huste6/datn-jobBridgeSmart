nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  imagePullPolicy: IfNotPresent
  imageTag: "latest"

keyvault:
  enabled: false
  name: "your-keyvault-name"
  tenantId: "your-tenant-id"
  identityClientId: "your-managed-identity-client-id"
  secrets:
    - name: PORT
      alias: PORT
    - name: GIN-MODE
      alias: GIN_MODE
    - name: JWT-SECRET
      alias: JWT_SECRET
    - name: JWT-ISSUER
      alias: JWT_ISSUER
    - name: ACCESS-TOKEN-TTL-MINUTES
      alias: ACCESS_TOKEN_TTL_MINUTES
    - name: CLOUDINARY-URL
      alias: CLOUDINARY_URL
    - name: CLOUDINARY-FOLDER
      alias: CLOUDINARY_FOLDER
    - name: OPENAI-API-KEY
      alias: OPENAI_API_KEY
    - name: MODEL
      alias: MODEL
    - name: URL-BASE
      alias: URL_BASE

secretsFallback:
  PORT: "8080"
  GIN_MODE: "release"
  JWT_SECRET: "change-me-in-production"
  JWT_ISSUER: "jobbridge-api"
  ACCESS_TOKEN_TTL_MINUTES: "60"
  CLOUDINARY_URL: ""
  CLOUDINARY_FOLDER: "jobbridge/user"
  OPENAI_API_KEY: ""
  MODEL: "gpt-4o-mini"
  URL_BASE: "https://api.openai.com/v1"



mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
  service:
    port: 27017
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources: {}

services:
  frontend:
    enabled: true
    replicaCount: 1
    image:
      repository: your-dockerhub-or-acr/jobbridge-frontend
      tag: ""
    port: 80
    targetPort: 80
    needsMongo: false
    env: {}
    probes:
      readiness:
        path: /
      liveness:
        path: /
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    pdb:
      create: false
      minAvailable: 1
      # maxUnavailable: 1
  
  gateway:
    enabled: true
    replicaCount: 1
    image:
      repository: your-dockerhub-or-acr/jobbridge-gateway
      tag: ""
    port: 8080
    targetPort: 8080
    needsMongo: false
    env:
      GATEWAY_PORT: "8080"
      AUTH_SERVICE_URL: "http://{{ include \"jobbridge.fullname\" . }}-auth:8081"
      JOBS_SERVICE_URL: "http://{{ include \"jobbridge.fullname\" . }}-jobs:8082"
      AI_SERVICE_URL: "http://{{ include \"jobbridge.fullname\" . }}-ai:8085"
    probes:
      readiness:
        path: /health
      liveness:
        path: /health
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    pdb:
      create: false
      minAvailable: 1
      # maxUnavailable: 1

  auth:
    enabled: true
    replicaCount: 1
    image:
      repository: your-dockerhub-or-acr/jobbridge-auth
      tag: ""
    port: 8081
    targetPort: 8081
    needsMongo: true
    env:
      AUTH_SERVICE_PORT: "8081"
      MONGODB_DB: "jobbridge"
    probes:
      readiness:
        path: /health
      liveness:
        path: /health
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    pdb:
      create: false
      minAvailable: 1
      # maxUnavailable: 1

  jobs:
    enabled: true
    replicaCount: 1
    image:
      repository: your-dockerhub-or-acr/jobbridge-jobs
      tag: ""
    port: 8082
    targetPort: 8082
    needsMongo: true
    env:
      JOBS_SERVICE_PORT: "8082"
      MONGODB_DB: "jobbridge"
    probes:
      readiness:
        path: /health
      liveness:
        path: /health
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    pdb:
      create: false
      minAvailable: 1
      # maxUnavailable: 1
  
  ai:
    enabled: true
    replicaCount: 1
    image:
      repository: your-dockerhub-or-acr/jobbridge-ai
      tag: ""
    port: 8085
    targetPort: 8085
    needsMongo: true
    env:
      AI_SERVICE_PORT: "8085"
      MONGODB_DB: "jobbridge"
    probes:
      readiness:
        path: /health
      liveness:
        path: /health
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    pdb:
      create: false
      minAvailable: 1
      # maxUnavailable: 1
  
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: jobbridge.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.jobbridge.local
      paths:
        - path: /
          pathType: Prefix
          service: gateway
  tls: []
