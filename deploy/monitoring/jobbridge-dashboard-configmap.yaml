apiVersion: v1
kind: ConfigMap
metadata:
  name: jobbridge-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  jobbridge-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
          "targets": [
            {
              "expr": "1000 * (sum(increase(nginx_ingress_controller_request_duration_seconds_sum{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\"}[5m])) / clamp_min(sum(increase(nginx_ingress_controller_request_duration_seconds_count{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\"}[5m])), 1))",
              "legendFormat": "API Avg Latency",
              "refId": "A"
            }
          ],
          "title": "API Latency (ms, 5m avg)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "100 * ((sum(increase(nginx_ingress_controller_requests{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(increase(nginx_ingress_controller_requests{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\"}[5m])), 1))",
              "legendFormat": "5xx Error Rate",
              "refId": "A"
            }
          ],
          "title": "API Error Rate 5xx (%)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"jobbridge\"})",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ],
          "title": "JobBridge Pod Phase",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "ops"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
          "targets": [
            {
              "expr": "sum by (pod) (rate(kube_pod_container_status_restarts_total{namespace=\"jobbridge\"}[15m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod Restarts Rate (15m)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 80},
                  {"color": "green", "value": 95}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16},
          "id": 5,
          "options": {
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "100 * (sum(kube_pod_status_ready{namespace=\"jobbridge\",condition=\"true\"}) / clamp_min(count(kube_pod_status_ready{namespace=\"jobbridge\",condition=\"true\"}),1))",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ],
          "title": "Pod Ready (%)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 3}
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 16},
          "id": 6,
          "options": {
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "sum((kube_pod_status_ready{namespace=\"jobbridge\",condition=\"true\"} == 0) or vector(0))",
              "legendFormat": "Not Ready",
              "refId": "A"
            }
          ],
          "title": "Pod Not Ready (count)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 16},
          "id": 7,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\"}[1m]))",
              "legendFormat": "Incoming traffic",
              "refId": "A"
            }
          ],
          "title": "Incoming Traffic (req/s)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 3}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 16},
          "id": 8,
          "options": {
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "100 * ((sum(increase(nginx_ingress_controller_requests{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\",status=~\"4..|5..\"}[5m])) or vector(0)) / clamp_min(sum(increase(nginx_ingress_controller_requests{host=\"jobbridge.duckdns.org\",ingress=\"jobbridge-jobbridge-ingress\"}[5m])), 1))",
              "legendFormat": "4xx/5xx",
              "refId": "A"
            }
          ],
          "title": "HTTP Error Rate 4xx/5xx (%)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 24},
          "id": 9,
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"jobbridge\",pod!=\"\"}[5m])))",
              "legendFormat": "{{pod}} Rx",
              "refId": "A"
            },
            {
              "expr": "topk(10, sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"jobbridge\",pod!=\"\"}[5m])))",
              "legendFormat": "{{pod}} Tx",
              "refId": "B"
            }
          ],
          "title": "Traffic by Pod (Rx/Tx bytes/s)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 33},
          "id": 10,
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"jobbridge\",pod!=\"\"}[5m])))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "CPU by Pod (cores)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["jobbridge", "kubernetes", "api"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "JobBridge - API & Pod Health",
      "uid": "jobbridge-api-health",
      "version": 1,
      "weekStart": ""
    }
